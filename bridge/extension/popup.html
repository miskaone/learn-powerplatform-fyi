<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebMCP Bridge</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font: 13px/1.4 system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #status {
        margin: 0 0 10px;
        padding: 8px;
        border-radius: 6px;
        background: color-mix(in srgb, canvastext 8%, canvas);
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 6px 8px;
        cursor: pointer;
      }
      #error {
        color: tomato;
        min-height: 1.2em;
        margin: 8px 0 0;
      }
      .hint {
        color: color-mix(in srgb, canvastext 55%, canvas);
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>WebMCP Bridge</h1>
    <p id="status">Checking…</p>
    <label for="token">Pairing token</label>
    <input id="token" type="password" autocomplete="off" />
    <label for="port">Port</label>
    <input id="port" type="number" value="8765" min="1" max="65535" />
    <div class="row">
      <button id="save" type="button">Save &amp; connect</button>
    </div>
    <div class="row">
      <button id="arm" type="button">Arm this tab</button>
      <button id="disarm" type="button">Disarm</button>
    </div>
    <p id="error"></p>
    <p class="hint">Only https://learn.powerplatform.fyi tabs can be armed.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
